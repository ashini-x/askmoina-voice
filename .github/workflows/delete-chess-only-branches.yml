name: Delete chess-only branches
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-chess-only-branches.yml"
permissions:
  contents: write
jobs:
  delete-chess-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all chess/Stockfish feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "bench/chess-elo-oct18"
            "chore/remove-chess-feature-everywhere"
            "feat/chess-ambient-detection"
            "feat/chess-continuous-next-strong-move"
            "feat/chess-next-strong-move-ux"
            "feat/chess-phase-3-game-state"
            "feat/chess-stockfish-phase-1-engine"
            "feat/chess-stockfish-phase-2-recognition"
            "feat/chess-stockfish-phase-3-move-tracking"
            "feat/full-stockfish-19-strong-analysis"
            "fix/authenticated-stockfish-live-smoke"
            "fix/chess-client-server-timeout-budget"
            "fix/chess-confirmation-retry-after-transient-failure"
            "fix/chess-gemini38-recognition-config"
            "fix/chess-illegal-moves"
            "fix/chess-next-move-refresh-position"
            "fix/chess-popup-entry-control"
            "fix/chess-recognition-digital-wording"
            "fix/chess-reset-pre-fix-state"
            "fix/chess-stockfish-live-test-standalone"
            "fix/chess-stockfish-wasm-csp"
            "fix/chess-synthetic-validates-confirmation-retry"
            "fix/chess-visible-frame-live-synthetic"
            "fix/digital-chessboard-recognition"
            "fix/fast-single-pass-chess-detection"
            "fix/full-stockfish-readiness-gate"
            "fix/full-stockfish-release-asset-source"
            "fix/live-single-pass-chess-gate"
            "fix/low-latency-chessboard-recognition"
            "fix/route-chess-assets-through-worker"
            "fix/run-full-engine-browser-smoke-directly"
            "fix/stockfish-message-event-data"
            "fix/stockfish-wasm-worker-csp"
            "phase4-chess-voice"
          )
          for branch in "${branches[@]}"; do
            if gh api --silent --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              echo "Deleted branch: ${branch}"
            else
              echo "Branch already deleted or protected: ${branch}"
            fi
          done

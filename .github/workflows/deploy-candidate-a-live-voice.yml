name: Deploy Candidate A Live voice (guarded)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: askmoina-candidate-a-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only the explicitly tagged Candidate A merge commit can trigger this deployment.
    if: contains(github.event.head_commit.message, '[deploy-candidate-a-voice]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b34a6c0b7221454c5db977fe61ddf759
      PRODUCTION_URL: https://askmoina-voice.thenewtongs.workers.dev
    steps:
      - name: Check out merged and validated Candidate A release
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm deployment credential exists without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN GitHub Actions secret is not configured. No production deployment was attempted."
            exit 1
          fi
          echo "Cloudflare deployment credential is present."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Validate the exact release before deploying
        run: |
          set -euo pipefail
          npm run check
          npm test
          npx wrangler deploy --dry-run --outdir=dist

      - name: Deploy Candidate A voice to the existing Worker
        run: npx wrangler deploy --message "Apply Candidate A custom Live voice (v0.4.4)"

      - name: Verify production health and selected voice
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "(()=>{const c=JSON.parse(require('node:fs').readFileSync('wrangler.jsonc','utf8')); return c.vars.LIVE_VOICE_ID?.trim() || c.vars.LIVE_VOICE_NAME})()")"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc','utf8')).vars.APP_VERSION")"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          passed=false
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --max-time 12 --output "$body" --write-out '%{http_code}' "$PRODUCTION_URL/api/health" || true)"
            if [[ "$code" == "200" ]] && node --input-type=module - "$body" "$version" "$expected" <<'NODE'
          import fs from "node:fs";
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const version = process.argv[3];
          const voice = process.argv[4];
          if (body.ok !== true) throw new Error("Production health reported not-ok.");
          if (body.version !== version) throw new Error(`Expected release ${version}, got ${String(body.version)}`);
          if (body.liveVoice !== voice) throw new Error(`Expected Live voice ${voice}, got ${String(body.liveVoice)}`);
          if (body.status !== "vertex-live-proxy-configured") throw new Error("Vertex Live route is not configured.");
          console.log(JSON.stringify({ok:body.ok,version:body.version,liveVoice:body.liveVoice,status:body.status,model:body.model,location:body.location}));
          NODE
            then
              passed=true
              break
            fi
            echo "Production not yet reporting Candidate A (attempt $attempt/30, HTTP ${code:-no-response}); retrying."
            sleep 10
          done
          if [[ "$passed" != "true" ]]; then
            echo "::error::Production did not report the Candidate A release within five minutes. Preserve current telemetry and initiate rollback review."
            cat "$body"
            exit 1
          fi

name: Production deployment and live synthetic verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: askmoina-candidate-a-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # This is the single production deploy path: every validated main push, or an explicit manual run.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b34a6c0b7221454c5db977fe61ddf759
      PRODUCTION_URL: https://askmoina-voice.thenewtongs.workers.dev
    steps:
      - name: Check out merged and validated Candidate A release
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm deployment credential exists without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN GitHub Actions secret is not configured. No production deployment was attempted."
            exit 1
          fi
          echo "Cloudflare deployment credential is present."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Validate the exact release before deploying
        run: |
          set -euo pipefail
          npm run check
          npm test
          npm run chess:smoke
          npx wrangler deploy --dry-run --outdir=dist


      - name: Validate benchmarks and release bundle contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run benchmark:validate
          grep -R -q 'normalizeGroundedDeviceContext' dist/
          grep -R -q 'assessGroundedSource' dist/
          grep -R -q 'MODEL MATCH NOT ESTABLISHED' dist/
          grep -R -q 'task_world_state' dist/
          grep -R -q 'assessSafetyAndUncertainty' dist/
          grep -R -q 'transitionRealityLoopState' dist/
          grep -R -q 'UNIVERSAL TASK ENGINE' dist/
          grep -R -q 'ZERO-LEARNING CAMERA-FIRST UX' dist/
          grep -R -q 'EFFICIENT INTELLIGENCE' dist/
          grep -R -q 'PERMISSION-BASED CONTINUITY' dist/
          grep -R -q 'ASSAMESE SPEECH EVALUATION CONTRACT' dist/
          echo "Benchmarks and M29–M37 release bundle contracts: OK"

      # Production D1 migrations are managed through the authorized Cloudflare control plane.
      # GitHub's Worker deployment token does not have D1 API permission (Cloudflare code 7403).
      # Migrations 0006_conversation_history.sql and 0007_user_memories.sql were applied and verified
      # through the authorized Cloudflare control plane and recorded in d1_migrations before promotion.

      - name: Upload validated AskMoina version without changing triggers
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(node -p "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc','utf8')).vars.APP_VERSION")"
          message="AskMoina Voice v${app_version} production release"
          # Upload a version without syncing queue-consumer triggers; those triggers already exist.
          upload_output="$(npx wrangler versions upload --message "$message" 2>&1)" || {
            printf '%s\n' "$upload_output"
            exit 1
          }
          printf '%s\n' "$upload_output"
          version_id="$(printf '%s\n' "$upload_output" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              // Wrangler can colour its output, so strip ANSI escapes before parsing.
              input = input.replace(/\x1B\[[0-?]*[ -/]*[@-~]/g, "");
              const match = input.match(/^Worker Version ID:\s*([0-9a-f-]{36})\s*$/m);
              if (!match) {
                process.stderr.write("Could not parse Worker Version ID from Wrangler output.\n");
                process.exitCode = 1;
                return;
              }
              process.stdout.write(match[1]);
            });
          ')"
          if [[ ! "$version_id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::Wrangler did not report a valid Worker version ID; refusing to promote."
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "Validated AskMoina version is uploaded: $version_id"

      - name: Promote uploaded version to 100% without changing triggers
        shell: bash
        run: |
          set -euo pipefail
          version_id="${{ steps.upload.outputs.version_id }}"
          promoted=false
          # Newly uploaded Worker versions can take a few seconds to become visible
          # to the Versions API. Retry propagation failures before using the guarded
          # health fallback below; never send traffic to an unverified version.
          for attempt in $(seq 1 8); do
            if npx wrangler versions deploy "${version_id}@100%"; then
              promoted=true
              break
            fi
            if [[ "$attempt" -lt 8 ]]; then
              echo "::warning::Uploaded version is not visible to the promotion API yet (attempt $attempt/8); retrying in 2 seconds."
              sleep 2
            fi
          done
          if [[ "$promoted" == "true" ]]; then
            exit 0
          fi

          # In some Cloudflare API failures, a successful version upload is already
          # automatically deployed at 100%. Continue only if production health proves
          # the intended release is already serving traffic; never mask a stale release.
          echo "::warning::Explicit version promotion failed; checking whether Cloudflare already deployed the uploaded release."
          expected_version="$(node -p "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc','utf8')).vars.APP_VERSION")"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status_code="$(curl --silent --show-error --max-time 12 --output "$response_file" --write-out '%{http_code}' "$PRODUCTION_URL/api/health" || true)"
          if [[ "$status_code" == "200" ]] && node --input-type=module - "$response_file" "$expected_version" <<'NODE'
          import fs from "node:fs";
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expectedVersion = process.argv[3];
          if (body.ok !== true || body.app !== "askmoina-voice" || body.version !== expectedVersion) {
            throw new Error(`Production is not serving the expected release ${expectedVersion}; refusing to continue.`);
          }
          console.log(JSON.stringify({alreadyServingUploadedRelease:true,version:body.version,status:body.status}));
          NODE
          then
            echo "Cloudflare already serves the expected uploaded version; continuing to synthetic verification."
          else
            echo "::error::Promotion failed and production health does not confirm the intended release. Refusing to continue."
            cat "$response_file"
            exit 1
          fi

      - name: Verify production health and selected voice
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "(()=>{const c=JSON.parse(require('node:fs').readFileSync('wrangler.jsonc','utf8')); return c.vars.LIVE_VOICE_NAME})()")"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc','utf8')).vars.APP_VERSION")"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          passed=false
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --max-time 12 --output "$body" --write-out '%{http_code}' "$PRODUCTION_URL/api/health" || true)"
            if [[ "$code" == "200" ]] && node --input-type=module - "$body" "$version" "$expected" <<'NODE'
          import fs from "node:fs";
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const version = process.argv[3];
          const voice = process.argv[4];
          if (body.ok !== true) throw new Error("Production health reported not-ok.");
          if (body.version !== version) throw new Error(`Expected release ${version}, got ${String(body.version)}`);
          if (body.liveVoice !== voice) throw new Error(`Expected Live voice ${voice}, got ${String(body.liveVoice)}`);
          if (body.status !== "vertex-live-proxy-configured") throw new Error("Vertex Live route is not configured.");
          console.log(JSON.stringify({ok:body.ok,version:body.version,liveVoice:body.liveVoice,status:body.status,model:body.model,location:body.location}));
          NODE
            then
              passed=true
              break
            fi
            echo "Production not yet reporting Candidate A (attempt $attempt/30, HTTP ${code:-no-response}); retrying."
            sleep 10
          done
          if [[ "$passed" != "true" ]]; then
            echo "::error::Production did not report the Candidate A release within five minutes. Preserve current telemetry and initiate rollback review."
            cat "$body"
            exit 1
          fi

      - name: Verify critical routes and no-guest access after deployment
        env:
          BASE_URL: https://askmoina-voice.thenewtongs.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          fetch_status() {
            curl --silent --show-error --max-time 25 --output "$2" --write-out "%{http_code}" "$BASE_URL$1"
          }
          status="$(fetch_status /api/health /tmp/moina-health.json)"
          test "$status" = "200"
          grep -q '"ok":true' /tmp/moina-health.json
          grep -q '"app":"askmoina-voice"' /tmp/moina-health.json
          echo "Health endpoint: OK"

          status="$(fetch_status /login.html /tmp/moina-login.html)"
          test "$status" = "302"
          echo "Legacy login URL redirects into the native app: OK"
          status="$(fetch_status /auth.js /tmp/moina-auth.js)"
          test "$status" = "200"
          grep -q 'navigator.credentials.create' /tmp/moina-auth.js
          grep -q 'navigator.credentials.get' /tmp/moina-auth.js
          node --check /tmp/moina-auth.js
          echo "Passkey client: OK"

          status="$(fetch_status /session-ui.js /tmp/moina-session-ui.js)"
          test "$status" = "302"
          echo "Unauthenticated shared session UI denied: OK"

          status="$(fetch_status /api/auth/me /tmp/moina-auth-me.json)"
          test "$status" = "200"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const me = JSON.parse(readFileSync("/tmp/moina-auth-me.json", "utf8"));
          if (me.authenticated !== false) throw new Error("Anonymous request unexpectedly resolved to an account.");
          console.log("No-guest identity endpoint: OK");
          NODE

          status="$(fetch_status /api/voice/status /tmp/moina-voice-status.json)"
          test "$status" = "401"
          echo "Anonymous voice status denied: OK"
          status="$(fetch_status / /tmp/moina-home.html)"
          test "$status" = "200"
          grep -q 'Continue with Face ID or Touch ID' /tmp/moina-home.html
          grep -q 'OR USE YOUR PHONE' /tmp/moina-home.html
          if grep -Eq 'modeCreate|modeSignin|Signup or login' /tmp/moina-home.html; then
            echo "Login entry exposes a removed account-mode switch." >&2
            exit 1
          fi
          echo "Anonymous home serves the sign-in entry: OK"

          status="$(fetch_status '/?view=about' /tmp/moina-about.html)"
          test "$status" = "200"
          grep -q 'A camera-first co-pilot for the real world.' /tmp/moina-about.html
          echo "Native About screen: OK"
          status="$(fetch_status '/?view=privacy' /tmp/moina-privacy.html)"
          test "$status" = "200"
          grep -q 'Your camera. Your control.' /tmp/moina-privacy.html
          echo "Native Privacy screen: OK"

          status="$(fetch_status /copilot /tmp/moina-copilot.html)"
          test "$status" = "302"
          echo "Anonymous Co-Pilot access denied: OK"
          status="$(fetch_status /vault /tmp/moina-vault.html)"
          test "$status" = "404"
          echo "Legacy Vault route retired: OK"

          status="$(fetch_status /admin/login /tmp/moina-admin-login.html)"
          test "$status" = "200"
          grep -q 'AskMoina Admin' /tmp/moina-admin-login.html
          echo "Admin login page: OK"
          status="$(fetch_status /admin /tmp/moina-admin.html)"
          test "$status" = "302"
          echo "Unauthenticated admin redirect: OK"
          status="$(fetch_status /admin/api/overview /tmp/moina-admin-api.json)"
          test "$status" = "401"
          echo "Unauthenticated admin API denied: OK"

      - name: Verify standalone PWA installation and browser gate
        env:
          BASE_URL: https://askmoina-voice.thenewtongs.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          fetch_status() {
            curl --silent --show-error --max-time 25 --output "$2" --write-out "%{http_code}" "$BASE_URL$1"
          }

          status="$(fetch_status /install /tmp/moina-install.html)"
          if [[ "$status" != "200" ]]; then
            echo "::error::PWA install page returned HTTP $status"
            head -c 1000 /tmp/moina-install.html || true
            exit 1
          fi
          if ! grep -q 'Install askmoina' /tmp/moina-install.html; then
            echo "::error::PWA install page is missing the install CTA"
            head -c 1000 /tmp/moina-install.html || true
            exit 1
          fi
          if ! grep -q 'Open as Web App' /tmp/moina-install.html; then
            echo "::error::PWA install page is missing iOS Open as Web App guidance"
            head -c 1000 /tmp/moina-install.html || true
            exit 1
          fi
          echo "PWA installation landing and lowercase askmoina CTA: OK"

          status="$(fetch_status /manifest.webmanifest /tmp/moina-manifest.json)"
          if [[ "$status" != "200" ]]; then
            echo "::error::PWA manifest route returned HTTP $status"
            head -c 1000 /tmp/moina-manifest.json || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("/tmp/moina-manifest.json", "utf8"));
          const manifestIconPath = (icon) => (icon.src || "").split("?")[0];
          if (manifest.display !== "standalone") throw new Error("PWA manifest must use standalone display mode.");
          if (manifest.start_url !== "/?source=pwa") throw new Error("PWA manifest start_url mismatch.");
          if (manifest.scope !== "/") throw new Error("PWA manifest scope mismatch.");
          if (!Array.isArray(manifest.icons) ||
              !manifest.icons.some(icon => manifestIconPath(icon) === "/pwa-icon-192.svg" && icon.sizes === "192x192") ||
              !manifest.icons.some(icon => manifestIconPath(icon) === "/pwa-icon-512.svg" && icon.sizes === "512x512") ||
              !manifest.icons.some(icon => manifestIconPath(icon) === "/pwa-icon-512.png" && icon.sizes === "512x512" && icon.type === "image/png") ||
              manifest.icons.some(icon => ["/askmoina-bird-final.png", "/askmoina-app-icon-180.png"].includes(manifestIconPath(icon))) ||
              manifest.background_color !== "#090A0D" || manifest.theme_color !== "#090A0D") {
            console.error("Manifest icon entries received:", JSON.stringify(manifest.icons));
            throw new Error("Manifest must use a dark splash background, a true 512x512 PNG, and no legacy light icon.");
          }
          console.log("PWA manifest contract: OK");
          NODE

          for asset in /favicon.svg /favicon-32.png /install.css /askmoina-liquid-system.css /offline /service-worker.js /pwa-gate.css /pwa-gate.js /pwa-runtime.js /askmoina-bird-final.png /pwa-icon-192.svg /pwa-icon-512.svg /pwa-icon-512.png /askmoina-app-icon-180.png /askmoina-mark.svg /askmoina-mark-dark.svg /askmoina-app-icon.svg /askmoina-app-icon-light.svg /askmoina-logo.svg /askmoina-logo-dark.svg /askmoina-social-avatar.svg /askmoina-visual-guide.svg /askmoina-install-reference.webp /askmoina-install-reference-mobile.webp; do
            status="$(fetch_status "$asset" "/tmp/moina-pwa-asset")"
            if [[ "$status" != "200" ]]; then
              echo "::error::PWA asset $asset returned HTTP $status"
              head -c 500 /tmp/moina-pwa-asset || true
              exit 1
            fi
          done
          status="$(fetch_status /service-worker.js /tmp/moina-service-worker.js)"
          test "$status" = "200"
          grep -q 'askmoina-pwa-shell-v19' /tmp/moina-service-worker.js
          grep -q 'isImmutableVersionedAsset ? fetch(request)' /tmp/moina-service-worker.js
          grep -q 'fetch(request, { cache: "no-store" })' /tmp/moina-service-worker.js
          echo "PWA install/offline shell assets and update-safe service worker: OK"

          app_version="$(node -p "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc','utf8')).vars.APP_VERSION")"
          status="$(curl --silent --show-error --max-time 25 --dump-header /tmp/moina-experience-css.headers --output /tmp/moina-experience-css --write-out "%{http_code}" "$BASE_URL/copilot.css?experience-selection=1&v=${app_version}")"
          test "$status" = "200"
          grep -qi 'Cache-Control: public, max-age=31536000, immutable' /tmp/moina-experience-css.headers
          echo "Release-versioned Co-Pilot CSS uses long-lived browser caching: OK"

          status="$(fetch_status "/native-app.css?v=${app_version}" /tmp/moina-native-app.css)"
          test "$status" = "200"
          grep -q 'askmoina-screen-fade-up' /tmp/moina-native-app.css
          grep -q 'prefers-reduced-motion:reduce' /tmp/moina-native-app.css
          echo "Apple-style entrance fade and reduced-motion fallback are present in production CSS: OK"

          status="$(fetch_status / /tmp/moina-home.html)"
          test "$status" = "200"
          grep -q 'data-askmoina-pwa-gate="pending"' /tmp/moina-home.html
          grep -q 'href="/manifest.webmanifest?v=20261018"' /tmp/moina-home.html
          grep -q 'src="/pwa-gate.js"' /tmp/moina-home.html
          echo "Main app standalone gate: OK"

          # The legacy /login.html route now redirects into the same camera-first
          # sign-in shell used at /. Validate the real shell instead of the retired page.
          grep -q 'Continue with Face ID or Touch ID' /tmp/moina-home.html
          grep -q 'OR USE YOUR PHONE' /tmp/moina-home.html
          grep -q 'data-askmoina-pwa-gate="pending"' /tmp/moina-home.html
          grep -q 'src="/pwa-gate.js"' /tmp/moina-home.html
          echo "Native sign-in PWA gate: OK"

      - name: Synthetic live web-grounding and voice-memory verification
        shell: bash
        env:
          BASE_URL: https://askmoina-voice.thenewtongs.workers.dev
        run: |
          set -euo pipefail
          set +x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m venv .venv-production-smoke
          . .venv-production-smoke/bin/activate
          python -m pip install --quiet --disable-pip-version-check websocket-client

          # Register through the real passkey endpoint, using Chromium's
          # virtual authenticator. Never log the session token.
          SMOKE_COOKIE="$(node scripts/synthetic-passkey-session.mjs)"
          if [[ ! "$SMOKE_COOKIE" =~ ^moina_session=[A-Za-z0-9_-]{43}$ ]]; then
            echo "::error::Synthetic passkey setup did not return a valid session."
            exit 1
          fi
          echo "::add-mask::$SMOKE_COOKIE"
          export ASKMOINA_SYNTHETIC_COOKIE="$SMOKE_COOKIE"
          cleanup() {
            curl --silent --show-error --max-time 12 --output /dev/null \
              --request POST "$BASE_URL/api/auth/logout" \
              --header "Origin: $BASE_URL" \
              --header "Cookie: $ASKMOINA_SYNTHETIC_COOKIE" \
              --header "Content-Type: application/json" --data '{}' || true
          }
          trap cleanup EXIT
          # Run every synthetic independently. A failure in a product synthetic suite must not
          # prevent the session recovery and long-running voice continuity checks from running.
          set +e
          node scripts/live-chess-recognition-smoke.mjs
          CHESS_RECOGNITION_STATUS=$?
          python scripts/live-turn-latency-benchmark.py
          TURN_LATENCY_STATUS=$?
          python scripts/live-grounding-smoke.py
          GROUNDING_STATUS=$?
          python scripts/live-spoken-turn-smoke.py
          SPOKEN_TURN_STATUS=$?
          python scripts/live-ranked-list-smoke.py
          RANKED_LIST_STATUS=$?
          python scripts/live-memory-voice-smoke.py
          MEMORY_VOICE_STATUS=$?
          node scripts/live-network-recovery-smoke.mjs
          NETWORK_RECOVERY_STATUS=$?
          node scripts/live-session-continuity-smoke.mjs
          LIVE_CONTINUITY_STATUS=$?
          node scripts/live-conversation-history-smoke.mjs
          CONVERSATION_HISTORY_STATUS=$?
          set -e

          cleanup
          trap - EXIT
          echo "Synthetic session revoked: OK"
          for result in \
            "live digital chess recognition:$CHESS_RECOGNITION_STATUS" \
            "turn-latency benchmark:$TURN_LATENCY_STATUS" \
            "grounded web search:$GROUNDING_STATUS" \
            "speech-first voice turn:$SPOKEN_TURN_STATUS" \
            "ranked-list flow:$RANKED_LIST_STATUS" \
            "voice memory:$MEMORY_VOICE_STATUS" \
            "browser network recovery:$NETWORK_RECOVERY_STATUS" \
            "long-running Live continuity:$LIVE_CONTINUITY_STATUS" \
            "persistent conversation history:$CONVERSATION_HISTORY_STATUS"; do
            name="${result%:*}"
            status="${result##*:}"
            if [[ "$status" -eq 0 ]]; then
              echo "Synthetic $name: PASS"
            else
              echo "::error::Synthetic $name failed (exit $status)."
            fi
          done
          test "$CHESS_RECOGNITION_STATUS" -eq 0
          test "$TURN_LATENCY_STATUS" -eq 0
          test "$GROUNDING_STATUS" -eq 0
          test "$SPOKEN_TURN_STATUS" -eq 0
          test "$RANKED_LIST_STATUS" -eq 0
          test "$MEMORY_VOICE_STATUS" -eq 0
          test "$NETWORK_RECOVERY_STATUS" -eq 0
          test "$LIVE_CONTINUITY_STATUS" -eq 0
          test "$CONVERSATION_HISTORY_STATUS" -eq 0


name: Experimental Gemini Live Candidate A replicated voice test

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/live-candidate-a-replicated-voice

permissions:
  contents: read
  actions: read

concurrency:
  group: askmoina-live-candidate-a-replicated-voice-test
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-live-voice-test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read project ID from the experimental Worker config
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project_id="$(node -p "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc', 'utf8')).vars.GCP_PROJECT_ID")"
          test -n "$project_id"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Prepare temporary Google credentials
        id: credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-candidate-a-output
          if [[ -z "${GCP_SERVICE_ACCOUNT_JSON:-}" ]]; then
            cat > live-candidate-a-output/live-voice-test-report.json <<'JSON'
          {"status":"blocked","reason":"GCP_SERVICE_ACCOUNT_JSON GitHub Actions secret is unavailable; no Google API request was made."}
          JSON
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Candidate A test blocked: Google credential secret unavailable."
            exit 0
          fi
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp-service-account.json"
          chmod 600 "$RUNNER_TEMP/gcp-service-account.json"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Google credential presence verified; secret contents were not printed."

      - name: Install Google Gen AI SDK
        if: steps.credentials.outputs.available == 'true'
        run: python -m pip install --disable-pip-version-check "google-genai>=2.25.0"

      - name: Test Candidate A voice-design ID directly in Gemini Live
        id: direct_voice_test
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-service-account.json
          GCP_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          GEMINI_LOCATION: us-central1
          GEMINI_MODEL: gemini-3.8-live
        run: python scripts/test-live-custom-voice-id.py

      - name: Compare Candidate A with Leda and probe expressive audio
        id: comparison_test
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-service-account.json
          GCP_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          GEMINI_LOCATION: us-central1
          GEMINI_MODEL: gemini-3.8-live
        run: python scripts/compare-live-candidate-a-vs-leda.py

      - name: Publish test result summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          out = pathlib.Path("live-candidate-a-output")
          out.mkdir(exist_ok=True)
          def load(name):
              p = out / name
              try:
                  return json.loads(p.read_text(encoding="utf-8")) if p.exists() else {"status": "no_report"}
              except Exception:
                  return {"status": "report_unreadable"}
          direct = load("candidate-a-direct-live-voice-report.json")
          comparison = load("candidate-a-live-comparison-report.json")
          lines = ["## Candidate A Gemini Live voice test", "", "### Direct custom voice ID", "", f"**Status:** {direct.get('status', 'unknown')}"]
          if direct.get("error_type"):
              lines += ["", f"**Error type:** {direct['error_type']}", "", f"**Diagnostic:** {direct.get('error', '')}"]
          if direct.get("first_audio_ms") is not None:
              lines += ["", f"- First audio: {direct['first_audio_ms']} ms", f"- Total response generation: {direct.get('total_response_ms')} ms", f"- Audio duration: {direct.get('audio_duration_seconds')} seconds"]
          lines += ["", "### Candidate A vs Leda and expression probe", "", f"**Status:** {comparison.get('status', 'unknown')}"]
          if comparison.get("error_type"):
              lines += ["", f"**Error type:** {comparison['error_type']}", "", f"**Diagnostic:** {comparison.get('error', '')}"]
          comp = comparison.get("comparison", {})
          if comp:
              lines += [
                  "", f"- Candidate A first audio: {comp.get('candidate_a_first_audio_ms')} ms",
                  f"- Leda first audio: {comp.get('leda_first_audio_ms')} ms",
                  f"- Candidate A minus Leda: {comp.get('candidate_a_minus_leda_first_audio_ms')} ms",
              ]
          for item in comparison.get("scenarios", []):
              lines += ["", f"- {item.get('label')}: {item.get('audio_duration_seconds')} seconds; first audio {item.get('first_audio_ms')} ms; total {item.get('total_response_ms')} ms"]
          lines += ["", "The timing is based on one sample per scenario; a listener should judge voice similarity and whether any expressions sound natural.", "", "No production Worker configuration or deployment was changed."]
          (out / "live-voice-test-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Upload the test audio and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: askmoina-live-candidate-a-voice-test
          path: live-candidate-a-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary Google credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/gcp-service-account.json"


name: Live chess recognition synthetic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: askmoina-live-chess-recognition-synthetic
  cancel-in-progress: true

jobs:
  live-chess-recognition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://askmoina-voice.thenewtongs.workers.dev
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install Chromium for the synthetic screen
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node --check scripts/live-chess-recognition-smoke.mjs
          node --check scripts/live-stockfish-browser-smoke.mjs
          node --check scripts/synthetic-passkey-session.mjs

      - name: Create temporary authenticated synthetic session
        shell: bash
        run: |
          set -euo pipefail
          set +x
          SMOKE_COOKIE="$(node scripts/synthetic-passkey-session.mjs)"
          if [[ ! "$SMOKE_COOKIE" =~ ^moina_session=[A-Za-z0-9_-]{43}$ ]]; then
            echo "::error::Synthetic passkey setup did not return a valid session."
            exit 1
          fi
          echo "::add-mask::$SMOKE_COOKIE"
          echo "ASKMOINA_SYNTHETIC_COOKIE=$SMOKE_COOKIE" >> "$GITHUB_ENV"
          echo "Synthetic authenticated session: ready"

      - name: Wait for the deployed fast single-pass chess detection
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            client_status="$(curl --silent --show-error --max-time 10 --output /tmp/recognition-client.js --write-out '%{http_code}' \
              --header "Cookie: $ASKMOINA_SYNTHETIC_COOKIE" \
              "$BASE_URL/chess/recognition-client.js?v=0.4.145" || true)"
            ui_status="$(curl --silent --show-error --max-time 10 --output /tmp/chess-ui.js --write-out '%{http_code}' \
              --header "Cookie: $ASKMOINA_SYNTHETIC_COOKIE" \
              "$BASE_URL/chess/chess-ui.js?v=0.4.145" || true)"
            page_status="$(curl --silent --show-error --max-time 10 --dump-header /tmp/copilot-page.headers --output /tmp/copilot-page.html --write-out '%{http_code}' \
              --header "Cookie: $ASKMOINA_SYNTHETIC_COOKIE" "$BASE_URL/copilot" || true)"
            engine_status="$(curl --silent --show-error --max-time 10 --dump-header /tmp/stockfish.headers --output /dev/null --write-out '%{http_code}' \
              --header "Cookie: $ASKMOINA_SYNTHETIC_COOKIE" \
              "$BASE_URL/chess/stockfish-19-single.js?v=19.0.1" || true)"
            engine_client_status="$(curl --silent --show-error --max-time 10 --output /tmp/engine-client.js --write-out '%{http_code}' \
              --header "Cookie: $ASKMOINA_SYNTHETIC_COOKIE" \
              "$BASE_URL/chess/engine-client.js?v=0.4.146" || true)"
            wasm_status="$(curl --silent --show-error --max-time 15 --head --dump-header /tmp/stockfish-wasm.headers --output /dev/null --write-out '%{http_code}' \
              --header "Cookie: $ASKMOINA_SYNTHETIC_COOKIE" \
              "$BASE_URL/chess/stockfish-19-single.wasm?v=19.0.1" || true)"
            if [[ "$client_status" == "200" && "$ui_status" == "200" && "$engine_status" == "200" && "$engine_client_status" == "200" && "$wasm_status" == "200" && "$page_status" == "200" ]] &&
               grep -Fq "script-src 'self' 'wasm-unsafe-eval'" /tmp/copilot-page.html &&
               grep -Eiq '^content-security-policy:.*wasm-unsafe-eval' /tmp/copilot-page.headers &&
               grep -Fq 'export async function retryStableChessboardRecognition' /tmp/recognition-client.js &&
               grep -Fq 'AbortSignal.timeout(32_000)' /tmp/recognition-client.js &&
               grep -Fq 'function validateRecognitionCandidate(recognition)' /tmp/chess-ui.js &&
               grep -Fq 'Only take one fresh-frame retry if the first provider read was unusable.' /tmp/chess-ui.js &&
               grep -Fq 'engine-client.js?v=0.4.146' /tmp/chess-ui.js &&
               grep -Fq 'Stockfish 19.0.1 full single-threaded' /tmp/engine-client.js &&
               grep -Eiq '^content-security-policy:.*wasm-unsafe-eval' /tmp/stockfish.headers &&
               grep -Eiq '^content-type: *application/wasm' /tmp/stockfish-wasm.headers &&
               grep -Eiq '^content-length: *[1-9][0-9]{7,}' /tmp/stockfish-wasm.headers; then
              ready=true
              break
            fi
            echo "Waiting for the deployed chess fixes (attempt $attempt/60; client HTTP ${client_status:-no-response}, UI HTTP ${ui_status:-no-response}, page HTTP ${page_status:-no-response}, engine HTTP ${engine_status:-no-response}, engine client HTTP ${engine_client_status:-no-response}, full WASM HTTP ${wasm_status:-no-response}, full-engine headers pending)."
            sleep 5
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::The deployed chess client/Stockfish full-engine script/WASM route did not expose the expected strong-engine and recognition fixes."
            exit 1
          fi
          echo "Production full Stockfish engine, streaming WASM route, and single-pass recognition are ready."

      - name: Verify Stockfish starts and returns a legal move in the real browser
        run: node scripts/live-stockfish-browser-smoke.mjs

      - name: Verify the live digital chessboard end to end
        run: node scripts/live-chess-recognition-smoke.mjs

      - name: Revoke synthetic session
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${ASKMOINA_SYNTHETIC_COOKIE:-}" ]]; then
            curl --silent --show-error --max-time 12 --output /dev/null \
              --request POST "$BASE_URL/api/auth/logout" \
              --header "Origin: $BASE_URL" \
              --header "Cookie: $ASKMOINA_SYNTHETIC_COOKIE" \
              --header "Content-Type: application/json" --data '{}'
          fi
          echo "Synthetic session cleanup requested."

name: Release validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run check
      - run: node --check public/app.js
      - run: node --check public/copilot.js
      - run: node --check public/auth.js
      - name: Validate required production secrets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const required = ["GCP_SERVICE_ACCOUNT_JSON", "ADMIN_DASHBOARD_PASSWORD", "ADMIN_SESSION_SECRET"];
          for (const name of required) {
            if (!config.secrets?.required?.includes(name)) {
              console.error(`Missing required production secret declaration: ${name}`);
              process.exitCode = 1;
            }
          }
          NODE
      - run: npm run benchmark:validate
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir=dist
      - name: Verify M29/M30 Worker bundle contracts
        run: |
          grep -R -q 'normalizeGroundedDeviceContext' dist/
          grep -R -q 'assessGroundedSource' dist/
          grep -R -q 'MODEL MATCH NOT ESTABLISHED' dist/
          grep -R -q 'task_world_state' dist/
      - name: Verify M31/M32 Worker bundle contracts
        run: |
          grep -R -q 'assessSafetyAndUncertainty' dist/
          grep -R -q 'transitionRealityLoopState' dist/
          grep -R -q 'SAFETY AND UNCERTAINTY ENGINE' dist/
          grep -R -q 'ONE CONTINUOUS REALITY LOOP' dist/
      - name: Verify M33/M34 Worker bundle contracts
        run: |
          grep -R -q 'UNIVERSAL TASK ENGINE' dist/
          grep -R -q 'Do not ask the user to choose a task type' dist/
          grep -R -q 'ZERO-LEARNING CAMERA-FIRST UX' dist/
          grep -R -q 'Keep optional or expert controls out of the main path' dist/
      - name: Verify M35/M36 Worker bundle contracts
        run: |
          grep -R -q 'EFFICIENT INTELLIGENCE' dist/
          echo "M35 prompt contract: OK"
          grep -R -q 'inspectProviderUsageMetrics' dist/
          echo "Provider usage parser contract: OK"
          grep -R -q 'PERMISSION-BASED CONTINUITY' dist/
          echo "M36 prompt contract: OK"
          grep -R -q 'askmoina.memory.consent.v1' dist/
          echo "Memory consent key contract: OK"
          grep -R -q 'Edit memory' dist/
          echo "Vault edit capability contract: OK"
      - name: Verify M37 speech contract and M38 benchmark suites
        run: |
          grep -R -q "ASSAMESE SPEECH EVALUATION CONTRACT" dist/
          echo "M37 production voice/Co-Pilot contract: OK"
          npm run benchmark:validate
          echo "M38 versioned benchmark suites: OK"
      - uses: actions/upload-artifact@v4
        with:
          name: askmoina-worker-bundle
          path: dist/
          if-no-files-found: error

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Production smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://askmoina-voice.thenewtongs.workers.dev
        run: |
          set -eu
          fetch_status() {
            curl --silent --show-error --max-time 25 --output "$2" --write-out "%{http_code}" "$BASE_URL$1"
          }
          status="$(fetch_status /api/health /tmp/moina-health.json)"
          test "$status" = "200"
          grep -q '"ok":true' /tmp/moina-health.json
          grep -q '"app":"askmoina-voice"' /tmp/moina-health.json
          echo "Health endpoint: OK"

          status="$(fetch_status /login.html /tmp/moina-login.html)"
          test "$status" = "200"
          grep -q 'Face ID' /tmp/moina-login.html
          grep -q 'Touch ID' /tmp/moina-login.html
          grep -q 'Phone number + OTP' /tmp/moina-login.html
          status="$(fetch_status /auth.js /tmp/moina-auth.js)"
          test "$status" = "200"
          grep -q 'navigator.credentials.create' /tmp/moina-auth.js
          grep -q 'navigator.credentials.get' /tmp/moina-auth.js
          node --check /tmp/moina-auth.js
          echo "Passkey client and three-method login page: OK"

          status="$(fetch_status /api/auth/me /tmp/moina-auth-me.json)"
          test "$status" = "200"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const me = JSON.parse(readFileSync("/tmp/moina-auth-me.json", "utf8"));
          if (me.authenticated !== false) throw new Error("Anonymous request unexpectedly resolved to an account.");
          console.log("No-guest identity endpoint: OK");
          NODE
          status="$(fetch_status /api/voice/status /tmp/moina-voice-status.json)"
          test "$status" = "401"
          echo "Anonymous voice status denied: OK"
          status="$(fetch_status / /tmp/moina-home.html)"
          test "$status" = "302"
          echo "Anonymous home access denied: OK"
          status="$(fetch_status /copilot /tmp/moina-copilot.html)"
          test "$status" = "302"
          echo "Anonymous Co-Pilot access denied: OK"
          status="$(fetch_status /vault /tmp/moina-vault.html)"
          test "$status" = "302"
          echo "Anonymous Memory Vault access denied: OK"

          status="$(fetch_status /admin/login /tmp/moina-admin-login.html)"
          test "$status" = "200"
          grep -q 'AskMoina Admin' /tmp/moina-admin-login.html
          echo "Admin login page: OK"

          status="$(fetch_status /admin /tmp/moina-admin.html)"
          test "$status" = "302"
          echo "Unauthenticated admin redirect: OK"

          status="$(fetch_status /admin/api/overview /tmp/moina-admin-api.json)"
          test "$status" = "401"
          echo "Unauthenticated admin API denied: OK"

      - name: Synthetic live web grounding test
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'fix: verify live web grounding') }}"
        env:
          BASE_URL: https://askmoina-voice.thenewtongs.workers.dev
        run: |
          set -eu
          python3 -m venv .venv-grounding-smoke
          . .venv-grounding-smoke/bin/activate
          python -m pip install --quiet --disable-pip-version-check websocket-client
          python scripts/live-grounding-smoke.py

      - name: Synthetic live voice memory smoke test
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'fix: share opted-in memory context across browser tabs') }}"
        env:
          BASE_URL: https://askmoina-voice.thenewtongs.workers.dev
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
          python3 -m venv .venv-live-smoke
          . .venv-live-smoke/bin/activate
          python -m pip install --quiet --disable-pip-version-check websocket-client
          python scripts/live-memory-voice-smoke.py

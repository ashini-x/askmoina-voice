name: Release validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run check
      - run: node --check public/app.js
      - run: node --check public/copilot.js
      - name: Validate required production secrets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const required = ["GCP_SERVICE_ACCOUNT_JSON", "ADMIN_DASHBOARD_PASSWORD", "ADMIN_SESSION_SECRET"];
          for (const name of required) {
            if (!config.secrets?.required?.includes(name)) {
              console.error(`Missing required production secret declaration: ${name}`);
              process.exitCode = 1;
            }
          }
          NODE
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir=dist
      - name: Verify M29/M30 Worker bundle contracts
        run: |
          grep -R -q 'normalizeGroundedDeviceContext' dist/
          grep -R -q 'assessGroundedSource' dist/
          grep -R -q 'MODEL MATCH NOT ESTABLISHED' dist/
          grep -R -q 'task_world_state' dist/
      - name: Verify M31/M32 Worker bundle contracts
        run: |
          grep -R -q 'assessSafetyAndUncertainty' dist/
          grep -R -q 'transitionRealityLoopState' dist/
          grep -R -q 'SAFETY AND UNCERTAINTY ENGINE' dist/
          grep -R -q 'ONE CONTINUOUS REALITY LOOP' dist/
      - name: Verify M33/M34 Worker bundle contracts
        run: |
          grep -R -q 'UNIVERSAL TASK ENGINE' dist/
          grep -R -q 'Do not ask the user to choose a task type' dist/
          grep -R -q 'ZERO-LEARNING CAMERA-FIRST UX' dist/
          grep -R -q 'Keep optional or expert controls out of the main path' dist/
      - name: Verify M35/M36 Worker bundle contracts
        run: |
          grep -R -q 'M35 — EFFICIENT INTELLIGENCE' dist/
          grep -R -q 'inspectProviderUsageMetrics' dist/
          grep -R -q 'M36 — PERMISSION-BASED CONTINUITY' dist/
          grep -R -q 'askmoina.memory.consent.v1' dist/
          grep -R -q 'Edit memory' dist/
      - uses: actions/upload-artifact@v4
        with:
          name: askmoina-worker-bundle
          path: dist/
          if-no-files-found: error

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Production smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://askmoina-voice.thenewtongs.workers.dev
        run: |
          set -eu
          fetch_status() {
            curl --silent --show-error --max-time 25 --output "$2" --write-out "%{http_code}" "$BASE_URL$1"
          }
          status="$(fetch_status /api/health /tmp/moina-health.json)"
          test "$status" = "200"
          grep -q '"ok":true' /tmp/moina-health.json
          grep -q '"app":"askmoina-voice"' /tmp/moina-health.json
          echo "Health endpoint: OK"

          status="$(fetch_status /api/voice/status /tmp/moina-voice-status.json)"
          test "$status" = "200"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const status = JSON.parse(readFileSync("/tmp/moina-voice-status.json", "utf8"));
          if (status.reason === "not_configured") {
            throw new Error("Production voice credentials are missing from the deployed Worker");
          }
          if (typeof status.reason !== "string") {
            throw new Error("Voice status response is missing its reason field");
          }
          console.log("Voice backend configuration: OK (" + status.reason + ")");
          NODE

          status="$(fetch_status /vault /tmp/moina-vault.html)"
          test "$status" = "200"
          grep -q 'Your memories' /tmp/moina-vault.html
          grep -q 'recovery code' /tmp/moina-vault.html
          echo "Memory Vault page: OK"

          status="$(fetch_status /vault.js /tmp/moina-vault.js)"
          test "$status" = "200"
          grep -q 'PBKDF2-SHA-256' /tmp/moina-vault.js
          grep -q 'Edit memory' /tmp/moina-vault.js
          grep -q 'Save changes' /tmp/moina-vault.js
          grep -q 'askmoina.memory.consent.v1' /tmp/moina-vault.js
          grep -q 'voiceContextPreview' /tmp/moina-vault.html
          node --check /tmp/moina-vault.js
          echo "Memory Vault crypto, edit controls, and explicit consent: OK"

          status="$(fetch_status /copilot /tmp/moina-copilot.html)"
          test "$status" = "200"
          grep -q 'Live Co-Pilot' /tmp/moina-copilot.html
          grep -q 'not world-locked AR' /tmp/moina-copilot.html
          grep -q 'Tell Moina your goal in your own words.' /tmp/moina-copilot.html
          grep -q 'Compare these' /tmp/moina-copilot.html
          echo "Live Co-Pilot page and M34 first-use guidance: OK"

          status="$(fetch_status /copilot.js /tmp/moina-copilot.js)"
          test "$status" = "200"
          grep -q 'copilot_mode: true' /tmp/moina-copilot.js
          grep -q 'refreshAvailabilityAfterRelease' /tmp/moina-copilot.js
          grep -q 'function mergeSceneModel' /tmp/moina-copilot.js
          grep -q 'function formatSceneModelSummary' /tmp/moina-copilot.js
          grep -q 'function createPersistentSpatialTrack' /tmp/moina-copilot.js
          grep -q 'function updatePersistentSpatialTrack' /tmp/moina-copilot.js
          grep -q 'invalidateSceneEvidence("zoom-change")' /tmp/moina-copilot.js
          grep -q 'invalidateSceneEvidence("camera-switch")' /tmp/moina-copilot.js
          grep -q 'not world-locked AR' /tmp/moina-copilot.js
          grep -q 'function classifyVisualVerification' /tmp/moina-copilot.js
          grep -q 'function formatVisualVerificationSummary' /tmp/moina-copilot.js
          grep -q 'function normalizeSpatialCues' /tmp/moina-copilot.js
          grep -q 'ai-guide-region' /tmp/moina-copilot.js
          grep -q 'function createTaskWorldModel' /tmp/moina-copilot.js
          grep -q 'function mergeTaskWorldModel' /tmp/moina-copilot.js
          grep -q 'function formatTaskWorldModelSummary' /tmp/moina-copilot.js
          grep -q 'function assessSafetyAndUncertainty' /tmp/moina-copilot.js
          grep -q 'function transitionRealityLoopState' /tmp/moina-copilot.js
          grep -q 'M31: local safety gate' /tmp/moina-copilot.js
          grep -q 'M32: explicit state machine' /tmp/moina-copilot.js
          grep -q 'Connected. Tell Moina what you want to do in your own words.' /tmp/moina-copilot.js
          grep -q 'Try: “Set this up” · “Compare these” · “Explain this”' /tmp/moina-copilot.js
          grep -q 'shouldSuppressStableFrame' /tmp/moina-copilot.js
          grep -q 'Adaptive camera sampling' /tmp/moina-copilot.js
          grep -q 'askmoina.memory.consent.v1' /tmp/moina-copilot.js
          node --check /tmp/moina-copilot.js
          echo "Live Co-Pilot client, M34 onboarding, M35 adaptive sampling, and M36 consent gate: OK"
          echo "M25/M26 deployed client bundle: scene model, evidence invalidation, and persistent local tracking OK"
          echo "M27/M28 deployed client bundle: guarded visual verification and generative spatial cue rendering OK"
          echo "M29 deployed client bundle: session-local task world model and guarded outcome continuity OK"
          echo "M31 deployed client bundle: consequence-aware safety gate and hazardous-overlay suppression OK"
          echo "M32 deployed client bundle: AR/camera handoff state machine and fresh-frame gate OK"
          echo "M33/M34 deployed Worker bundle: universal task instruction and zero-learning UX contract OK"
          echo "M35/M36 deployed Worker bundle: adaptive sampling, provider usage telemetry, and permission-based memory continuity OK"

          status="$(fetch_status /copilot.css /tmp/moina-copilot.css)"
          test "$status" = "200"
          grep -q '.focus-marker' /tmp/moina-copilot.css
          echo "Live Co-Pilot styles: OK"

          status="$(fetch_status /app.js /tmp/moina-app.js)"
          test "$status" = "200"
          grep -q 'readOptedInMemoryContext' /tmp/moina-app.js
          grep -q 'askmoina.memory.consent.v1' /tmp/moina-app.js
          node --check /tmp/moina-app.js
          echo "Regular voice explicit memory-consent gate: OK"

          status="$(fetch_status /continuity.js /tmp/moina-continuity.js)"
          test "$status" = "200"
          grep -q 'askmoina.memory.consent.v1' /tmp/moina-continuity.js
          node --check /tmp/moina-continuity.js
          echo "Cross-tab stale memory cache revocation: OK"

          status="$(fetch_status /transcript-merge.js /tmp/moina-transcript-merge.js)"
          test "$status" = "200"
          grep -q 'root.AskMoinaTranscript = Object.freeze({ merge })' /tmp/moina-transcript-merge.js
          node --check /tmp/moina-transcript-merge.js
          echo "Shared transcript merge helper: OK"

          status="$(fetch_status /admin/login /tmp/moina-admin-login.html)"
          test "$status" = "200"
          grep -q 'AskMoina Admin' /tmp/moina-admin-login.html
          echo "Admin login page: OK"

          status="$(fetch_status /admin /tmp/moina-admin.html)"
          test "$status" = "302"
          echo "Unauthenticated admin redirect: OK"

          status="$(fetch_status /admin/api/overview /tmp/moina-admin-api.json)"
          test "$status" = "401"
          echo "Unauthenticated admin API denied: OK"

      - name: Synthetic live web grounding test
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'fix: verify live web grounding') }}"
        env:
          BASE_URL: https://askmoina-voice.thenewtongs.workers.dev
        run: |
          set -eu
          python3 -m venv .venv-grounding-smoke
          . .venv-grounding-smoke/bin/activate
          python -m pip install --quiet --disable-pip-version-check websocket-client
          python scripts/live-grounding-smoke.py

      - name: Synthetic live voice memory smoke test
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'fix: share opted-in memory context across browser tabs') }}"
        env:
          BASE_URL: https://askmoina-voice.thenewtongs.workers.dev
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
          python3 -m venv .venv-live-smoke
          . .venv-live-smoke/bin/activate
          python -m pip install --quiet --disable-pip-version-check websocket-client
          python scripts/live-memory-voice-smoke.py

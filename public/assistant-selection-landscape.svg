<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Abstract violet and blue sunset landscape">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111729"/>
      <stop offset=".35" stop-color="#3a3550"/>
      <stop offset=".58" stop-color="#d18c87"/>
      <stop offset=".76" stop-color="#f0bc9a"/>
      <stop offset="1" stop-color="#1d477b"/>
    </linearGradient>
    <radialGradient id="sunset" cx="55%" cy="28%" r="52%">
      <stop offset="0" stop-color="#ffe5bb" stop-opacity=".98"/>
      <stop offset=".13" stop-color="#f5bca2" stop-opacity=".74"/>
      <stop offset=".42" stop-color="#df91a9" stop-opacity=".25"/>
      <stop offset="1" stop-color="#e7a3bc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="distantHills" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a8eaf"/>
      <stop offset=".3" stop-color="#635a7b"/>
      <stop offset=".68" stop-color="#373958"/>
      <stop offset="1" stop-color="#315983"/>
    </linearGradient>
    <linearGradient id="frontHills" x1="0" y1="0" x2="1" y2=".1">
      <stop offset="0" stop-color="#17192d"/>
      <stop offset=".33" stop-color="#503d68"/>
      <stop offset=".63" stop-color="#242e51"/>
      <stop offset="1" stop-color="#17668d"/>
    </linearGradient>
    <linearGradient id="violetRibbon" x1="0" y1="0" x2="1" y2=".15">
      <stop offset="0" stop-color="#ed9dc9" stop-opacity="0"/>
      <stop offset=".19" stop-color="#ffb3d2" stop-opacity=".86"/>
      <stop offset=".45" stop-color="#9c8dff" stop-opacity=".82"/>
      <stop offset=".75" stop-color="#7b9fff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#79e4f2" stop-opacity=".95"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#10182b"/>
  <rect width="1200" height="800" fill="url(#sky)" opacity=".82"/>
  <ellipse cx="680" cy="225" rx="470" ry="300" fill="url(#sunset)"/>
  <ellipse cx="675" cy="244" rx="54" ry="38" fill="#ffe5c3" opacity=".55" filter="url(#soft)"/>
  <circle cx="675" cy="245" r="10" fill="#fff0d8" opacity=".94"/>
  <path d="M-60 382 C125 265 202 215 345 279 S572 367 730 321 S1004 237 1260 310 L1260 800 L-60 800Z" fill="url(#distantHills)" opacity=".82"/>
  <path d="M-80 443 C92 333 180 357 320 392 S528 437 670 395 S947 316 1280 408 L1280 800 L-80 800Z" fill="#41405f" opacity=".8"/>
  <path d="M-40 470 C150 365 246 396 367 446 S573 483 731 430 S1014 375 1250 447 L1250 800 L-40 800Z" fill="url(#frontHills)"/>
  <path d="M-40 505 C125 412 204 425 354 483 S579 539 752 481 S1010 419 1250 471" fill="none" stroke="#f7a7d0" stroke-opacity=".36" stroke-width="35" filter="url(#glow)"/>
  <path d="M-40 490 C125 404 204 417 354 475 S579 531 752 473 S1010 411 1250 463" fill="none" stroke="url(#violetRibbon)" stroke-width="5"/>
  <path d="M-40 494 C125 408 204 421 354 479 S579 535 752 477 S1010 415 1250 467" fill="none" stroke="#ffe0ec" stroke-opacity=".48" stroke-width="1.7"/>
  <path d="M-70 576 C110 510 225 519 366 562 S630 624 794 564 S1031 509 1280 557 L1280 820 L-70 820Z" fill="#111b35" opacity=".72"/>
  <path d="M-80 630 C150 561 298 583 438 628 S679 678 851 628 S1072 590 1280 626" fill="none" stroke="#6579d7" stroke-opacity=".28" stroke-width="3"/>
  <rect width="1200" height="800" fill="url(#sunset)" opacity=".38"/>
  <rect width="1200" height="800" fill="#060a17" opacity=".13"/>
</svg>
plugins {
    id "com.android.application"
}

def askMoinaBaseUrl = project.findProperty("askmoinaBaseUrl") ?: "https://askmoina-voice.thenewtongs.workers.dev/"

android {
    namespace "com.askmoina.voice"
    compileSdk 35

    defaultConfig {
        applicationId "com.askmoina.voice"
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "ASKMOINA_BASE_URL", "\"\${askMoinaBaseUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
